# Защитные заголовки для страниц сайта, которые раздаёт Nginx.
# Подключается строкой  include /etc/nginx/snippets/ryazdetailing-security.conf;
# в каждом location со статикой (см. nginx-ryazdetailing.conf). Копия:
#   sudo cp deploy/nginx-security-headers.conf /etc/nginx/snippets/ryazdetailing-security.conf
#
# Почему отдельным файлом и в каждом location: в Nginx add_header из внешнего блока
# НЕ наследуется, если во внутреннем есть свой add_header (у нас он есть — Cache-Control).
#
# CSP без 'unsafe-inline' для скриптов и <style>: на сайте нет inline-JS, inline-стилевых
# блоков и атрибутов onclick/onchange (обработчики — js/actions.js, стили — css/*.css).
# style-src-attr 'unsafe-inline' оставлен только для атрибутов style="..." (их много в разметке
# и в карточках, которые строит JS); выполнять код они не могут.
# Раскатка: если хотите сначала понаблюдать, замените имя заголовка на
# Content-Security-Policy-Report-Only и посмотрите консоль браузера (F12) на всех страницах.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' data: blob:; frame-src https://yandex.ru; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), payment=()" always;
# HSTS браузер учитывает только при HTTPS (после certbot).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
