# /etc/nginx/sites-available/ryazdetailing  (потом: ln -s в sites-enabled)
# Пока нет домена — замените server_name на _ и работайте по IP (только для проверки).
server {
    listen 80;
    server_name ryazdetailing.ru www.ryazdetailing.ru;   # <- ваш реальный домен

    root /var/www/ryazdetailing;   # сюда кладётся содержимое папки сайта
    index index.html;

    client_max_body_size 12m;      # отзывы: аватар + 3 фото (до 2 МБ каждое) приходят base64 в JSON

    # Проверка состояния для мониторинга (наружу отдаются только ok/fail).
    location = /health       { proxy_pass http://127.0.0.1:3000; }
    location = /health/ready { proxy_pass http://127.0.0.1:3000; }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Фото отзывов (сохраняются backend'ом как файлы, не base64 в БД).
    # ^~ обязателен: без него блок ниже с кэшем по расширению .jpg/.png
    # перехватил бы /uploads/*.jpg первым и Nginx начал бы искать такой файл
    # прямо в /var/www/ryazdetailing — где его, конечно, нет.
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # CSS/JS без хэша в имени: браузер каждый раз проверяет версию (ETag),
    # поэтому после выкладки пользователи сразу получают свежий код.
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/ryazdetailing-security.conf;
        try_files $uri =404;
    }

    # Картинки и шрифты — кэш на месяц (имена файлов меняются редко)
    location ~* \.(webp|avif|jpg|png|svg|woff2)$ {
        # Один заголовок вместо «expires 30d» + «add_header»: иначе браузер получает два Cache-Control.
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/ryazdetailing-security.conf;
        try_files $uri =404;
    }

    # Страницы услуг из админки лежат в /services/<slug>/ — сам каталог /services/ ведёт на список услуг.
    location = /services/ {
        return 301 /services.html;
    }

    # HTML, sitemap.xml, robots.txt: всегда проверять свежесть (иначе после выкладки
    # браузер может показывать старую версию страницы).
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/ryazdetailing-security.conf;
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json
               application/manifest+json image/svg+xml;
}
# HTTPS, вариант А (проще): после привязки домена выполните
#   sudo certbot --nginx -d ryazdetailing.ru -d www.ryazdetailing.ru
# certbot сам добавит 443 и редирект с 80.
# Вариант Б (полный контроль: TLS 1.2+, OCSP, www→без www, Brotli) — файл nginx-ryazdetailing-https.conf, см. DEPLOY.md, раздел 4.
