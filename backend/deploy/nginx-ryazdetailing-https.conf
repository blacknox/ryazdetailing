# /etc/nginx/sites-available/ryazdetailing — ФИНАЛЬНЫЙ вариант с HTTPS (порт 443 + редирект с 80).
# Работает на nginx 1.18+ (Ubuntu 22.04/24.04). Используйте ПОСЛЕ получения сертификата (см. DEPLOY.md, раздел 4, вариант Б).
# Если выбрали «certbot --nginx» (вариант А) — этот файл не нужен: certbot сам правит nginx-ryazdetailing.conf.
#
# Замените: ryazdetailing.ru → ваш домен (во всех местах), /var/www/ryazdetailing → папка сайта.
# Синтаксис всегда проверяйте перед перезагрузкой:  sudo nginx -t && sudo systemctl reload nginx

server_tokens off;

# ── 80: только проверка Let's Encrypt и редирект на HTTPS ─────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name ryazdetailing.ru www.ryazdetailing.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;      # сюда certbot кладёт файлы проверки (--webroot)
    }
    location / {
        return 301 https://ryazdetailing.ru$request_uri;   # HTTP рабочую версию не отдаёт
    }
}

# ── www → без www (одна «главная» версия для поисковиков) ──────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ryazdetailing.ru;

    ssl_certificate     /etc/letsencrypt/live/ryazdetailing.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ryazdetailing.ru/privkey.pem;
    # TLS: только современные протоколы. Параметры повторены в каждом 443-блоке намеренно: в разных версиях
    # nginx/OpenSSL протоколы могут браться из default-сервера сокета, а не из блока по SNI, поэтому не полагаемся
    # на наследование. На http-уровне задавать нельзя — конфликт с дистрибутивным /etc/nginx/nginx.conf.
    # Проверка: deploy/check-production.sh (TLS 1.0/1.1 должны отклоняться, TLS 1.2/1.3 — работать).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 301 https://ryazdetailing.ru$request_uri;
}

# ── 443: сам сайт ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ryazdetailing.ru;

    root /var/www/ryazdetailing;
    index index.html;

    # Сертификат продлевает certbot (таймер systemd).
    ssl_certificate     /etc/letsencrypt/live/ryazdetailing.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ryazdetailing.ru/privkey.pem;
    # TLS: только современные протоколы. Параметры задаются в КАЖДОМ 443-блоке (и здесь, и ниже): nginx применяет
    # протоколы к сокету по default-серверу, и если они есть лишь в одном блоке, соседний оставался на системных
    # TLSv1/TLSv1.1 из /etc/nginx/nginx.conf. Задавать их на уровне http нельзя — конфликт с дистрибутивным конфигом.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 12m;   # отзывы: аватар + 3 фото приходят base64 в JSON (до ~11 МБ)

    # ── Сжатие ────────────────────────────────────────────────────────────────
    # HTML сжимается всегда; ниже — остальные текстовые типы.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json
               application/manifest+json image/svg+xml;
    # Brotli (на 15–20% мельче gzip) — по желанию. Нужен модуль:
    #   sudo apt install libnginx-mod-http-brotli-filter libnginx-mod-http-brotli-static
    # затем раскомментируйте три строки и сделайте  sudo nginx -t  (без модуля nginx не запустится):
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css text/xml application/xml application/javascript application/json application/manifest+json image/svg+xml;

    # ── API и загруженные фото — на Node ──────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # без этого cookie входа не получит флаг Secure
        proxy_read_timeout 30s;
    }
    # /health и /health/ready для мониторинга аптайма (наружу отдают только ok/fail).
    location = /health       { proxy_pass http://127.0.0.1:3000; }
    location = /health/ready { proxy_pass http://127.0.0.1:3000; }

    # ^~ обязателен: иначе блок ниже с кэшем по расширению перехватил бы /uploads/*.jpg.
    # Файлы в uploads/ получают уникальное имя (время + UUID) и не перезаписываются, поэтому
    # Node отдаёт их с «immutable» — браузер не будет переспрашивать месяц.
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Статика ───────────────────────────────────────────────────────────────
    # CSS/JS без хэша в имени: браузер каждый раз проверяет версию (ETag) — после
    # выкладки пользователи сразу получают свежий код, при этом не перекачивают неизменённое.
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/ryazdetailing-security.conf;
        try_files $uri =404;
    }

    # Картинки и шрифты — кэш на месяц (имена файлов меняются редко).
    # «immutable» здесь намеренно НЕТ: имена без хэша, и при замене картинки
    # посетители месяц видели бы старую. Хотите immutable — добавьте хэш в имена при сборке.
    location ~* \.(webp|avif|jpg|jpeg|png|gif|svg|ico|woff2)$ {
        # Один заголовок вместо «expires 30d» + «add_header»: иначе браузер получает два Cache-Control.
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/ryazdetailing-security.conf;
        try_files $uri =404;
    }

    # Страницы услуг из админки лежат в /services/<slug>/ — сам каталог /services/ ведёт на список услуг.
    location = /services/ {
        return 301 /services.html;
    }

    # HTML, sitemap.xml, robots.txt: всегда проверять свежесть (после выкладки и после
    # автоматической пересборки страниц услуг).
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/ryazdetailing-security.conf;
        try_files $uri $uri/ =404;
    }

    # Служебные файлы не отдаём.
    location ~ /\.(?!well-known) { deny all; }
    location ~ ^/(backend|node_modules|backups|data)/ { deny all; }
}
